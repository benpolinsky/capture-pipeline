[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "capture-pipeline"
version = "0.1.0"
description = "Mac-first CLI for Bentley iTwin reality-capture pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "azure-storage-blob>=12.22,<13",
  "httpx>=0.27,<1",
  "Pillow>=10.4,<12",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
capture = "capture_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/capture_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
